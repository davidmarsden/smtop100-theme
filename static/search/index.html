<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — Top 100</title>
  <meta name="theme-color" content="#0B1F3B">
  <link rel="stylesheet" href="/css/top100-brand.css">
  <link rel="stylesheet" href="/css/top100-refinements.css">
  <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
  <style>
    body { margin: 0; background: #f5f7fa; color: #0b1f3b; font-family: system-ui, sans-serif; }
    .search-shell { max-width: 900px; margin: 0 auto; padding: 48px 22px 72px; }
    .search-card { background: #fff; border: 1px solid rgba(11,31,59,.12); border-radius: 22px; padding: clamp(24px,4vw,42px); box-shadow: 0 12px 34px rgba(11,31,59,.06); }
    h1 { margin: 0 0 10px; font-size: clamp(34px,6vw,54px); letter-spacing: -.04em; }
    .lede { margin: 0 0 28px; color: #607086; font-size: 17px; }
    .back { display: inline-block; margin-top: 28px; font-weight: 800; color: #08755c; }
    @media (prefers-color-scheme: dark) {
      body { background: #071526; color: #e6edf5; }
      .search-card { background: #0d223a; border-color: rgba(203,213,225,.14); box-shadow: none; }
      .lede { color: #c7d2e0; }
      .back { color: #5ee6bd; }
    }
  </style>
</head>
<body>
  <main class="search-shell">
    <section class="search-card">
      <h1>Search Top 100</h1>
      <p class="lede">Search more than a decade of Top 100 posts.</p>
      <div id="search"></div>
      <a class="back" href="/">← Back to Top 100</a>
    </section>
  </main>
  <script src="/pagefind/pagefind-ui.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      if (typeof PagefindUI === 'undefined') return;
      var searchUI = new PagefindUI({
        element: '#search',
        showSubResults: true,
        processTerm: function (term) {
          var url = new URL(window.location.href);
          if (term) url.searchParams.set('q', term);
          else url.searchParams.delete('q');
          window.history.replaceState({}, '', url);
          return term;
        }
      });
      var query = new URLSearchParams(window.location.search).get('q');
      if (query) searchUI.triggerSearch(query);
    });
  </script>
</body>
</html>
