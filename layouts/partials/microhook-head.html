<link rel="stylesheet" href="/css/top100-brand.css?{{ .Site.Params.theme_seconds }}">
<link rel="stylesheet" href="/css/top100-refinements.css?{{ .Site.Params.theme_seconds }}">
<link rel="stylesheet" href="/css/top100-categories.css?{{ .Site.Params.theme_seconds }}">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1F3B'/%3E%3Cpath d='M10 45h44' stroke='%23CBD5E1' stroke-width='2'/%3E%3Ccircle cx='32' cy='45' r='5' fill='%230B1F3B' stroke='%23CBD5E1' stroke-width='2'/%3E%3Ctext x='32' y='35' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' font-weight='800' fill='%2310B981'%3E100%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0B1F3B">

<meta property="og:site_name" content="Top 100">
<meta property="og:type" content="{{ if eq .Type "post" }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}Top 100{{ else }}{{ printf "%s — Top 100" .Title }}{{ end }}">
<meta property="og:description" content="{{ if .IsHome }}A long-running 100-club Soccer Manager world with five divisions, competitions, records and manager-written history.{{ else }}{{ .Summary | plainify | truncate 200 }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="twitter:card" content="{{ if .Params.images }}summary_large_image{{ else }}summary{{ end }}">
<meta name="twitter:title" content="{{ if .IsHome }}Top 100{{ else }}{{ printf "%s — Top 100" .Title }}{{ end }}">
<meta name="twitter:description" content="{{ if .IsHome }}A long-running 100-club Soccer Manager world with five divisions, competitions, records and manager-written history.{{ else }}{{ .Summary | plainify | truncate 200 }}{{ end }}">
{{ with .Params.images }}
  {{ range first 1 . }}
<meta property="og:image" content="{{ . }}">
<meta name="twitter:image" content="{{ . }}">
  {{ end }}
{{ end }}

<script>
  document.title = {{ if .IsHome }}"Top 100"{{ else }}{{ printf "%s — Top 100" .Title | jsonify }}{{ end }};
</script>
