{{- /*
  Sumo Theme microhook.

  Sumo's post/single.html replaces its default date block whenever this partial
  exists, so we reproduce the date and then append recovered WordPress
  authorship for imported historical posts.
*/ -}}

<div class="post-date-wrapper">
  <time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">{{ partial "dateformat/long" . }}</time>
</div>

{{ partial "legacy-author.html" . }}
